[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "shanghai"
bytecode_hash = "none"
ffi = false
via_ir = true
gas_reports = ["ProofQuest"]

remappings = [
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
bsc_testnet = "${BSC_TESTNET_RPC_URL}"

[etherscan]
bsc = { key = "${BSCSCAN_API_KEY}", chain = 56 }
bsc_testnet = { key = "${BSCSCAN_API_KEY}", chain = 97 }
